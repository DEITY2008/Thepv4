name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Unzip project
        run: |
          mkdir -p /tmp/p
          for z in *.zip; do [ -f "$z" ] && unzip -oq "$z" -d /tmp/p || true; done
      - name: Build
        run: |
          if [ -f settings.gradle.kts ]; then D=$PWD; else D=$(dirname "$(find /tmp/p -name settings.gradle.kts | head -1)"); fi
          cd "$D"
          gradle assembleDebug --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/THEP_4WD_v4.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: THEP_4WD_v4_apk
          path: out/THEP_4WD_v4.apk
